{% extends 'template.html' %}
{% load static %}

{% block title %}Fundacija{% endblock %}
{% block content %}
<div class="container display-flex text-center text-success">
    {{ message }}
</div>
<div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Podrži umetnika🪙</h5>
            <button type="button" class="btn-close" ></button>
        </div>
        <div class="modal-body">
            <form>
                <label class="form-label">Izaberi iznos</label>
                <div class="d-flex gap-2 flex-wrap mb-3">
                    <button type="button" class="btn btn-outline-secondary amount-btn" data-amount="1">1€</button>
                    <button type="button" class="btn btn-outline-secondary amount-btn" data-amount="2">2€</button>
                    <button type="button" class="btn btn-outline-secondary amount-btn" data-amount="5">5€</button>
                    <button type="button" class="btn btn-outline-secondary amount-btn" data-amount="10">10€</button>
                    <button type="button" class="btn btn-outline-secondary amount-btn" data-amount="15">15€</button>
                    <button type="button" class="btn btn-outline-secondary amount-btn" data-amount="30">30€</button>
                </div>


                <div class="mb-3">
                    <label for="customAmount" class="form-label">Ili unesite svoju sumu (€)</label>
                    <input type="number" step="any" min="0.01" class="form-control" placeholder="Npr. 3.50">
                </div>


                <div class="alert alert-danger d-none"></div>


                <div class="d-flex justify-content-end">
                    <button type="button" class="btn back-button" data-bs-dismiss="modal">Otkaži</button>
                    <div class="alert"></div>
                    <button type="button" class="btn btn-warning" id="fund-btn">Fundiraj</button>
                </div>
            </form>
        </div>



        <button class="btn btn-light back-button" onclick="history.back()"> ⟸ Nazad </button>
    </div>
</div>

<br>
<br>
<div class="container hidden" id="pay-info">

    <form id="paymentForm" method="POST" action="{% url 'pay' artist_id %}">
        {% csrf_token %}

        <input type="hidden" name="amount" id="amountFakeInput" name="amount">

        <div class="mb-3">
            <label for="cardHolder" class="form-label">Ime i prezime na kartici</label>
            <input type="text" class="form-control" id="cardHolder" placeholder="npr. Ana Petrović" required>
        </div>

        <div class="mb-3">
            <label for="cardNumber" class="form-label">Broj kartice</label>
            <input type="text" inputmode="numeric" maxlength="19" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="expiry" class="form-label">Datum isteka (MM/YY)</label>
                <input type="text" class="form-control" id="expiry" placeholder="08/28" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="cvv" class="form-label">CVV kod</label>
                <input type="text" inputmode="numeric" maxlength="3" class="form-control" id="cvv" placeholder="123" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email (za potvrdu plaćanja)</label>
            <input type="email" class="form-control" id="email" placeholder="tvoj@email.com" name="email">
        </div>

        <button type="submit" class="btn btn-secondary w-100">Potvrdi plaćanje</button>
    </form>
</div>

<script>
    {#document.getElementById("fund-btn").addEventListener("click", function() {#}
    {#    document.getElementById("pay-info").classList.remove("hidden");#}
    {# );#}



    const fundBtn = document.getElementById("fund-btn");
    const payInfo = document.getElementById("pay-info");
    const amountFakeInput = document.getElementById("amountFakeInput");
    const customInput = document.querySelector("input[type='number']");
    const alertBox = document.querySelector(".alert");

    // Kad klikneš neku od ponuđenih suma
    document.querySelectorAll(".amount-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const amount = btn.getAttribute("data-amount");
            amountFakeInput.value = amount;
            customInput.value = ""; // ako se klikne ponuđena suma, prazni custom input
            alertBox.classList.add("d-none"); // sakrij poruku o grešci
        });
    });

    // Kad uneseš custom sumu ručno
    customInput.addEventListener("input", () => {
        amountFakeInput.value = customInput.value;
        alertBox.classList.add("d-none"); // sakrij poruku ako je korisnik uneo nešto

    });

    // Dugme "Fundiraj"
    fundBtn.addEventListener("click", function() {
        const amount = amountFakeInput.value;

        if (!amount || parseFloat(amount) <= 0) {
            alertBox.textContent = "Molimo izaberite ili unesite iznos koji želite da donirate.";
            alertBox.classList.remove("d-none");
            return; // prekini — ne otvaraj formu
        }

        payInfo.classList.remove("hidden"); // prikaži formu za plaćanje


    });





</script>

{% endblock %}
