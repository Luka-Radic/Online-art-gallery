{% extends "template.html" %}

{% load static %}
{% block title %}Login stranica{% endblock %}

{% block content %}

    <div class="container mt-5" style="max-width: 400px;">
        <h2>Logovanje</h2>
        <form method="POST" action="{% url 'login_page' %}">
            <div class="mb-3">
                <label for="korisnickoIme" class="form-label">Korisničko ime</label>
                <input type="text" class="form-control" id="korisnickoIme" name="username" required>
            </div>
            <div class="mb-3">
                <label for="lozinka" class="form-label">Lozinka</label>
                <input type="password" class="form-control" id="lozinka" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Prijavi se</button>
        </form>
        <div class="mt-3">
            <a href="{% url 'forgot_password' %}" class="text-primary text-decoration-underline">Zaboravili ste lozinku?</a>
        </div>
    </div>

{% endblock %}
