{% extends "template.html" %}
{% load static %}

{% block content %}
    <div class="container mt-5">
        <h2 class="text-center mb-4">Dodaj novu sliku</h2>

        <form method="POST" enctype="multipart/form-data"
              class="upload-form p-4 shadow-sm bg-light rounded">
            {% csrf_token %}

            <div class="mb-3">
                <input type="text" name="title" placeholder="Unesite naziv slike" required
                       class="form-control upload-input no-hover"/>
            </div>

            <div class="mb-3">
                <input type="file" name="image" accept="image/*" required
                       class="form-control upload-input no-hover"/>
            </div>

            <div class="mb-3">
            <textarea name="description" placeholder="Unesite opis slike"
                      class="form-control upload-input no-hover" rows="3"></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-secondary upload-btn">Dodaj sliku</button>
            </div>
        </form>
    </div>
{% endblock %}
